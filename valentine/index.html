<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>
<style>
body {height:100vh;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:Arial,sans-serif;background-color:#ffe6ee;text-align:center;}
h1 {margin-bottom:40px;font-size:40px;}
.buttons {display:flex;gap:30px;}
button {font-size:22px;padding:15px 35px;border:none;border-radius:12px;cursor:pointer;transition:transform 0.3s ease;}
#yes {background-color:#ff4d6d;color:white;}
#no {background-color:#cccccc;}
#photo {display:none;width:100vw;height:100vh;object-fit:cover;}
</style>
</head>
<body>
<h1>Can you be my Valentine ? 💖</h1>
<div class="buttons" id="buttons">
<button id="yes">Yes</button>
<button id="no">No</button>
</div>
<img id="photo" src="moderlux.jpg" alt="Valentine Photo">
<script>
let yesScale=1,noScale=1;
const yesBtn=document.getElementById("yes"),noBtn=document.getElementById("no");
const buttons=document.getElementById("buttons"),photo=document.getElementById("photo");
const title=document.querySelector("h1");
noBtn.addEventListener("click",()=>{
noScale-=0.1; yesScale+=0.15;
if(noScale<0.2) noScale=0.2;
noBtn.style.transform=`scale(${noScale})`;
yesBtn.style.transform=`scale(${yesScale})`;
});
yesBtn.addEventListener("click",()=>{
buttons.style.display="none";
title.style.display="none";
photo.style.display="block";
});
</script>
</body>
</html>
